<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERAÇÃO BELLA | Confidencial</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-panel: #141418;
            --lcdp-red: #d90429;
            --lcdp-red-dark: #8d021b;
            --text-main: #f1f1f1;
            --text-muted: #8a8a93;
            --success-green: #2ec4b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(217, 4, 41, 0.15) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            font-family: 'Courier Prime', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 12, 0.9);
            border-bottom: 1px solid #26262c;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            z-index: 10;
            letter-spacing: 1px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--lcdp-red);
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .container {
            width: 100%;
            max-width: 560px;
            background: var(--bg-panel);
            border: 1px solid #2a2a32;
            border-top: 4px solid var(--lcdp-red);
            border-radius: 4px;
            padding: 35px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
            position: relative;
            margin-top: 30px;
        }

        .badge {
            display: inline-block;
            background: var(--lcdp-red);
            color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            padding: 3px 10px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        h1, h2 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1.2;
        }

        h1 {
            font-size: 1.85rem;
            margin-bottom: 15px;
        }

        .highlight-red {
            color: var(--lcdp-red);
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========================================================
           QUADRO DE INVESTIGAÇÃO COM CORDÕES VERMELHOS
           ======================================================== */
        .evidence-board {
            position: relative;
            width: 100%;
            min-height: 410px;
            margin: 22px 0 26px 0;
            background-color: #161311;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(45, 35, 28, 0.45) 0%, rgba(10, 9, 8, 0.95) 100%),
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0);
            background-size: 100% 100%, 14px 14px;
            border: 4px solid #2b231d;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 10px 25px rgba(0,0,0,0.6);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 15px;
            overflow: hidden;
        }

        /* Camada SVG para os cordões vermelhos */
        .red-strings-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .string-line {
            stroke: #e60026;
            stroke-width: 2.2;
            filter: drop-shadow(0px 3px 3px rgba(0, 0, 0, 0.85));
            opacity: 0.92;
        }

        .string-line-thin {
            stroke: #b8001f;
            stroke-width: 1.4;
            stroke-dasharray: 4 2;
            opacity: 0.7;
        }

        /* Notas e recortes secundários no quadro */
        .clue-note {
            position: absolute;
            background: #e8e2d5;
            color: #1a1a1a;
            font-family: 'Courier Prime', monospace;
            font-size: 0.62rem;
            font-weight: bold;
            padding: 7px 9px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.75);
            z-index: 2;
            border-top: 2px solid #c9c1b1;
            line-height: 1.3;
        }

        .note-tl {
            top: 16px;
            left: 14px;
            transform: rotate(-7deg);
            max-width: 115px;
        }

        .note-tr {
            top: 18px;
            right: 14px;
            transform: rotate(6deg);
            background: #f2d06b;
            border-top-color: #d9b650;
            max-width: 110px;
        }

        .note-bl {
            bottom: 16px;
            left: 16px;
            transform: rotate(5deg);
            background: #1e1e24;
            color: #d90429;
            border: 1px solid #d90429;
            max-width: 120px;
        }

        .note-br {
            bottom: 18px;
            right: 16px;
            transform: rotate(-5deg);
            max-width: 115px;
        }

        /* Alfinetes / Tachinhas Vermelhas 3D */

            position: absolute;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff5c77, #d90429 60%, #6e0012 100%);
            box-shadow: 0 3px 5px rgba(0,0,
