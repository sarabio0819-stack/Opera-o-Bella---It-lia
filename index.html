<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-panel: #141418;
            --lcdp-red: #d90429;
            --lcdp-red-dark: #8d021b;
            --text-main: #f1f1f1;
            --text-muted: #8a8a93;
            --success-green: #2ec4b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(217, 4, 41, 0.15) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            font-family: 'Courier Prime', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 12, 0.9);
            border-bottom: 1px solid #26262c;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            z-index: 10;
            letter-spacing: 1px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--lcdp-red);
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

            width: 100%;
            max-width: 540px;
            background: var(--bg-panel);
            border: 1px solid #2a2a32;
            border-top: 4px solid var(--lcdp-red);
            border-radius: 4px;
            padding: 35px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
            position: relative;
            margin-top: 30px;
        }
